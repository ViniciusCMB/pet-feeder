<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tratador Automático</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
:root{--bg:#0b0c15;--card:#12132d;--accent:#7ee787;--text:#e6e8f0;--sub:#9aa0b5;}
*{box-sizing:border-box;font-family:'Inter',sans-serif;}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a1f4a,#0b0c15);min-height:100vh;color:var(--text);display:flex;align-items:center;justify-content:center;padding:2rem;}
.card{background:rgba(18,19,45,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.05);border-radius:24px;padding:2.5rem;max-width:480px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.6);}
h1{margin:0 0 .25rem;font-size:1.8rem;background:linear-gradient(90deg,#fff,#7ee787);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{color:var(--sub);margin-bottom:2rem;font-size:.95rem;}
label{display:block;margin:1rem 0 .35rem;font-weight:600;font-size:.85rem;color:var(--sub);}
input{width:100%;padding:.75rem 1rem;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:var(--text);font-size:1rem;transition:border-color .2s;}
input:focus{outline:none;border-color:var(--accent);}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;}
.btn{margin-top:1.5rem;width:100%;padding:.9rem;border-radius:12px;border:none;background:linear-gradient(90deg,#7ee787,#4ecdc4);color:#0b0c15;font-weight:800;font-size:1rem;cursor:pointer;transition:transform .1s,opacity .2s;}
.btn:hover{opacity:.92;transform:translateY(-2px);}
.status{margin-top:1rem;text-align:center;color:var(--accent);font-weight:600;min-height:1.5rem;}
</style>
</head>
<body>
<div class="card">
  <h1>Tratador Automático</h1>
  <p class="subtitle">Controle de alimentação do pet — rede local</p>

  <label>Manhã</label>
  <input type="time" id="morning" value="07:00">

  <label>Tarde</label>
  <input type="time" id="afternoon" value="13:00">

  <label>Noite</label>
  <input type="time" id="evening" value="19:00">

  <label style="margin-top:1.5rem">Tempo ativo (s)</label>
  <input type="number" id="activeTime" value="1" min="0.1" max="60" step="0.1">

  <button class="btn" onclick="salvar()">Salvar Configurações</button>
  <button class="btn" onclick="testar()" style="margin-top:.5rem;background:linear-gradient(90deg,#4ecdc4,#45b7d1);">Testar Motor</button>

  <div class="status" id="status"></div>
</div>
<script>
async function carregar(){
  const r=await fetch('/settings');
  const d=await r.json();
  document.getElementById('morning').value=d.morning;
  document.getElementById('afternoon').value=d.afternoon;
  document.getElementById('evening').value=d.evening;
  document.getElementById('activeTime').value=d.activeTime;
}
async function salvar(){
  const f={morning:document.getElementById('morning').value,
    afternoon:document.getElementById('afternoon').value,
    evening:document.getElementById('evening').value,
    activeTime:document.getElementById('activeTime').value};
  const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(f)});
  document.getElementById('status').textContent=await r.text();
}
async function testar(){
  const t=document.getElementById('activeTime').value;
  const r=await fetch('/test',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`activeTime=${t}`});
  document.getElementById('status').textContent=await r.text();
}
carregar();
</script>
</body>
</html>
